<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Peliculas</title>
</head>
<body class="bg-secondary container-fluid">
<nav class="navbar bg-dark" data-bs-theme="dark">
  <div class="container-fluid">
     <div class="container">
    <a class="navbar-brand" href="/">
      <img src="static/img/Logo.png" alt="Movies" width="55" height="45"> Peliculas
    </a>
  </div>
    <form class="d-flex" role="search" action="/search" method="GET">
      <input class="form-control me-2" type="search" name="q" placeholder="Buscar" aria-label="Buscar"/>
      <button class="btn btn-outline-danger" type="submit">Buscar</button>
    </form>
  </div>
</nav>

{% block contenido %} 
<div class="container-fluid p-4">
	<h2 class="text-white mb-4">Peliculas populares</h2>
	<div class="row">
		{% for p in movies %}
			<div class="col-12 col-sm-6 col-lg-3 mb-4">
				<div class="card h-100">
					{% if p.poster_full %}
						<img src="{{ p.poster_full }}" class="card-img-top" alt="{{ p.title }}">
					{% else %}
						<img src="/static/img/no-poster.png" class="card-img-top" alt="">
					{% endif %}
					<div class="card-body bg-dark text-white">
						<h5 class="card-title">{{ p.title }}</h5>
						<p class="card-text small">{{ p.release_date }}</p>
						<a href="/movie/{{ p.id }}" class="btn btn-primary btn-sm">Ver</a>
					</div>
				</div>
			</div>
		{% endfor %}
	</div>
</div>
{% endblock contenido %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
